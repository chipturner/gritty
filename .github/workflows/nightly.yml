name: Nightly Stress

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  issues: write

jobs:
  stress:
    name: Stress Test (5 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Install socat
        run: sudo apt-get update && sudo apt-get install -y socat

      # The `stress` profile disables retries (a pass-on-retry is a flake, and
      # this job exists to find flakes) and fail-fast (one failure must not
      # hide the rest of the run). More proptest cases than a PR run can
      # afford: the codec properties are where random seeds pay off.
      - name: Run test suite 5 times
        env:
          PROPTEST_CASES: "4096"
        run: |
          status=0
          for i in 1 2 3 4 5; do
            echo "=== Run $i/5 ==="
            cargo nextest run --locked --profile stress || status=1
          done
          exit "$status"

      # A scheduled run has no PR to turn red, so a failure would otherwise
      # go unnoticed. Keep one rolling issue rather than one per night.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly stress failed"
          body="Nightly stress run failed: ${RUN_URL}"
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number -q '.[0].number')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi

  mutants:
    name: Mutation Testing (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # ~850 mutants at ~50s each (30s incremental build + 20s test) on a
    # 4-vCPU runner is ~5h serial -- 150 minutes never finished (two nights,
    # ~300 mutants each). Four shards of ~210 run ~80 min, leaving headroom.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - uses: taiki-e/install-action@cargo-mutants

      # Informational: the scope and the survivors are listed in the job
      # summary and kept as an artifact. Surviving mutants are assertion
      # gaps to triage, not a red build -- promote to a gate once the
      # baseline is clean. Shards are 0-based (`--shard k/n`, k in 0..n).
      - name: Mutants
        run: cargo mutants --no-shuffle --jobs 2 --shard ${{ matrix.shard }}/4 --output mutants.out || true

      # `always()` so a shard that still hits the job timeout leaves its
      # partial results behind instead of discarding the whole run.
      - name: Summarize
        if: always()
        run: |
          {
            echo "## Mutants (shard ${{ matrix.shard }}/4)"
            echo
            echo '### Missed'
            echo '```'
            cat mutants.out/missed.txt 2>/dev/null || echo '(none)'
            echo '```'
            echo '### Timeouts'
            echo '```'
            cat mutants.out/timeout.txt 2>/dev/null || echo '(none)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
