# Socat disruption suites: each test is tempdir-isolated (own server + proxy
# processes), but they assert on timing windows around killed processes, so
# they get modest parallelism rather than the default one-per-core.
[test-groups.serial]
max-threads = 4

# PTY/daemon suites run at nextest's default parallelism (one thread per
# logical core). Timing waits are event-driven (marker reads, polls), so
# they tolerate load; retries absorb residual scheduler-jitter flakes.
[[profile.default.overrides]]
filter = 'binary(e2e_test) | binary(daemon_test) | binary(procscan_test) | binary(client_pty_test)'
retries = 2

[[profile.default.overrides]]
filter = 'binary(socat_tunnel_test) | binary(socat_bridge_test)'
test-group = 'serial'
retries = 2

[[profile.default.overrides]]
filter = 'binary(protocol_proptest)'
retries = 0

# Flake hunting (`just stress`, nightly): no retries, so a test that passes on
# its second try is reported as the failure it is, and no fail-fast, so one
# failure does not hide the rest of the run's signal.
[profile.stress]
retries = 0
fail-fast = false
